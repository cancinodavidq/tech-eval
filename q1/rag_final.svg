<svg width="680" viewBox="0 0 680 860" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family: sans-serif; background: white;">
<title>RAG vanilla — C4 Container diagram</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
text { font-family: sans-serif; fill: #2C2C2A; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
.c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
.c-gray .th { fill: #2C2C2A; }
.c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
.c-purple .th { fill: #3C3489; }
.c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal .th { fill: #085041; }
.c-coral rect { fill: #FAECE7; stroke: #993C1D; }
.c-coral .th { fill: #712B13; }
.c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
.c-amber .th { fill: #633806; }
.c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
.c-blue .th { fill: #0C447C; }
</style>
</defs>

<!-- User -->
<g class="c-gray">
<rect x="240" y="24" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="45" text-anchor="middle" dominant-baseline="central">User</text>
<text class="ts" x="340" y="65" text-anchor="middle" dominant-baseline="central">Natural language query</text>
</g>
<line x1="340" y1="80" x2="340" y2="112" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Orchestrator -->
<g class="c-purple">
<rect x="220" y="114" width="240" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="135" text-anchor="middle" dominant-baseline="central">API / Orchestrator</text>
<text class="ts" x="340" y="155" text-anchor="middle" dominant-baseline="central">FastAPI · coordinates pipeline</text>
</g>
<line x1="340" y1="170" x2="340" y2="202" stroke="#7F77DD" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Hybrid retriever boundary -->
<rect x="40" y="204" width="600" height="220" rx="12" fill="none" stroke="#AFA9EC" stroke-width="0.5" stroke-dasharray="5 3"/>
<text class="ts" x="56" y="222" dominant-baseline="central" fill="#7F77DD">Hybrid retriever · β = 0.7 semantic / 0.3 keyword</text>

<g class="c-teal">
<rect x="64" y="232" width="240" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="184" y="253" text-anchor="middle" dominant-baseline="central">Semantic search</text>
<text class="ts" x="184" y="273" text-anchor="middle" dominant-baseline="central">Embeddings · weight 0.7</text>
</g>
<g class="c-teal">
<rect x="376" y="232" width="240" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="496" y="253" text-anchor="middle" dominant-baseline="central">Keyword search</text>
<text class="ts" x="496" y="273" text-anchor="middle" dominant-baseline="central">BM25 · weight 0.3</text>
</g>
<path d="M184 288 L184 340 L270 340" fill="none" stroke="#1D9E75" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M496 288 L496 340 L410 340" fill="none" stroke="#1D9E75" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Metadata filter -->
<g class="c-coral">
<rect x="270" y="322" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="343" text-anchor="middle" dominant-baseline="central">Metadata filter</text>
<text class="ts" x="340" y="363" text-anchor="middle" dominant-baseline="central">Top-k chunks</text>
</g>
<line x1="340" y1="378" x2="340" y2="414" stroke="#D85A30" stroke-width="0.5" marker-end="url(#arrow)"/>
<text class="ts" x="358" y="397" dominant-baseline="central" fill="#888780">no reranking</text>

<!-- LLM generator -->
<g class="c-purple">
<rect x="200" y="416" width="280" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="441" text-anchor="middle" dominant-baseline="central">LLM generator</text>
<text class="ts" x="340" y="461" text-anchor="middle" dominant-baseline="central">Claude · Anthropic API</text>
<text class="ts" x="340" y="477" text-anchor="middle" dominant-baseline="central">Inline citations [1][2] · ALCE</text>
</g>
<path d="M480 451 L560 451 L560 142" fill="none" stroke="#7F77DD" stroke-width="0.5" marker-end="url(#arrow)"/>
<text class="ts" x="576" y="350" dominant-baseline="central" fill="#7F77DD">response</text>
<text class="ts" x="576" y="366" dominant-baseline="central" fill="#7F77DD">+ citations</text>
<path d="M560 142 L462 142" fill="none" stroke="#7F77DD" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M200 435 L120 435 L120 142" fill="none" stroke="#534AB7" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="54" y="420" dominant-baseline="central" fill="#534AB7">async</text>
<text class="ts" x="54" y="436" dominant-baseline="central" fill="#534AB7">trace</text>

<!-- Evals boundary -->
<rect x="40" y="550" width="600" height="200" rx="12" fill="none" stroke="#FAC775" stroke-width="0.5" stroke-dasharray="5 3"/>
<text class="ts" x="56" y="568" dominant-baseline="central" fill="#BA7517">Evals service · online loop over real traffic</text>
<g class="c-amber">
<rect x="64" y="578" width="260" height="88" rx="8" stroke-width="0.5"/>
<text class="th" x="194" y="603" text-anchor="middle" dominant-baseline="central">RAGAS</text>
<text class="ts" x="194" y="623" text-anchor="middle" dominant-baseline="central">Precision · Recall</text>
<text class="ts" x="194" y="641" text-anchor="middle" dominant-baseline="central">Recall@k · MAP</text>
<text class="ts" x="194" y="657" text-anchor="middle" dominant-baseline="central">Requires ground truth</text>
</g>
<g class="c-amber">
<rect x="356" y="578" width="260" height="88" rx="8" stroke-width="0.5"/>
<text class="th" x="486" y="603" text-anchor="middle" dominant-baseline="central">ALCE</text>
<text class="ts" x="486" y="623" text-anchor="middle" dominant-baseline="central">Citation precision</text>
<text class="ts" x="486" y="641" text-anchor="middle" dominant-baseline="central">Citation recall</text>
<text class="ts" x="486" y="657" text-anchor="middle" dominant-baseline="central">Evaluates inline citations</text>
</g>
<g class="c-blue">
<rect x="214" y="694" width="252" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="710" text-anchor="middle" dominant-baseline="central">Eval store</text>
<text class="ts" x="340" y="728" text-anchor="middle" dominant-baseline="central">PostgreSQL · traces + scores</text>
</g>
<line x1="194" y1="666" x2="300" y2="694" stroke="#BA7517" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="486" y1="666" x2="380" y2="694" stroke="#BA7517" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M120 550 L120 480 L200 480" fill="none" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="44" y="510" dominant-baseline="central" fill="#BA7517">feedback</text>

<!-- Ingestion boundary -->
<rect x="40" y="760" width="600" height="80" rx="12" fill="none" stroke="#B5D4F4" stroke-width="0.5" stroke-dasharray="5 3"/>
<text class="ts" x="56" y="778" dominant-baseline="central" fill="#185FA5">Ingestion pipeline · offline batch</text>
<g class="c-blue">
<rect x="64" y="786" width="220" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="174" y="802" text-anchor="middle" dominant-baseline="central">Chunking + embedding</text>
<text class="ts" x="174" y="820" text-anchor="middle" dominant-baseline="central">Fixed size · overlap</text>
</g>
<g class="c-blue">
<rect x="396" y="786" width="220" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="506" y="802" text-anchor="middle" dominant-baseline="central">Vector store + BM25</text>
<text class="ts" x="506" y="820" text-anchor="middle" dominant-baseline="central">pgvector · OpenSearch</text>
</g>
<path d="M284 808 L394 808" fill="none" stroke="#378ADD" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M174 786 L174 316 L270 316" fill="none" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M174 786 L174 666" fill="none" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M506 786 L506 730 L496 730 L496 666" fill="none" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- Sources -->
<g class="c-gray">
<rect x="40" y="24" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="110" y="45" text-anchor="middle" dominant-baseline="central">Sources</text>
<text class="ts" x="110" y="65" text-anchor="middle" dominant-baseline="central">PDFs · corp. docs</text>
</g>
<path d="M110 80 L110 808 L64 808" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
